# Example: an online English school. Copy to profiles/<yours>.yaml (business profiles are git-ignored).
name: example-language-school

business: >
  Online English school for adult beginners (A1–B1). The teacher films 40–60 s selfie videos on a phone,
  with humour and the English on screen. Likes plain-vs-native contrasts, phrase packs and skits about
  everyday situations. Never reuses other creators' footage.

discover:
  youtube:
    window: month
    shorts: true
    per_query: 30
    keywords:
      - english idioms
      - how native speakers say
      - stop saying in english
      - english phrases for everyday life
      - american english phrases
    hashtags: [englishidioms, learnenglish, englishteacher, americanenglish, englishphrases, englishvocabulary]
  tiktok:
    keywords: [english idioms]
    hashtags: [englishidioms, learnenglish]

watch:
  youtube: []
  instagram: []
  tiktok: []

seeds: []

filters:
  min_views: 5000
  max_age_days: 45
  must_match: english|idiom|phrase|pronunc|vocab|grammar|accent|native speaker|slang|word|speak
  exclude:
    - ielts|toefl|for kids
    - '🔴|\blive:|24/7'
    - \bnews\b|election

enrich_top: 60
recheck: {max_age_days: 30, limit: 60}
report: {top: 25}
