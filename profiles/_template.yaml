# Copy to profiles/<business>.yaml and fill in. Everything except keywords/hashtags is optional.
name: mybusiness
output_dir: ${OBSIDIAN_VAULT}/projects/mybusiness/marketing/viral   # default: reports/<name>/

# Who the ideas are for: audience, offer, who films, language, tone, formats you like, hard rules.
# The /viral-scout skill reads this when it turns viral formats into ideas for you.
business: ""
# taste_note: path to a note with likes/dislikes the skill should respect (optional)

discover:
  youtube:
    window: month          # hour | today | week | month | year
    shorts: true           # under 4 minutes
    per_query: 30
    keywords: []           # needs YOUTUBE_API_KEY for Shorts
    languages: {}          # keyword: ISO language code (ru, uk, es...) for the API's relevanceLanguage
    # region: US           # optional regionCode for the API
    hashtags: []           # work without a key
  tiktok:                  # needs APIFY_TOKEN
    keywords: []
    hashtags: []

watch:
  youtube: []              # @handle, channel URL or UC... id
  instagram: []            # usernames; needs IG_GRAPH_TOKEN
  tiktok: []               # usernames; needs APIFY_TOKEN

seeds: []                  # post URLs to track

filters:
  min_views: 5000
  max_age_days: 45
  must_match: ""           # regex; title without hashtags + channel must match (topic check)
  exclude: []              # regexes on title + channel

enrich_top: 60             # YouTube videos to open for likes/comments/date/subscribers
recheck: {max_age_days: 30, limit: 60}
report: {top: 25, hooks: 20, transcripts: 40}   # hooks shown / transcripts fetched per run

# swipe_dir: ${OBSIDIAN_VAULT}/projects/mybusiness/marketing/swipe   # default: <output_dir>/swipe

# Telegram alerts (TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in .env, or env_file to reuse another app's bot)
# alerts:
#   env_file: ""
#   min_outlier: 10        # × the creator's usual
#   min_baseline: 1000     # creator's usual views must be at least this
#   min_rise_per_day: 50000
#   min_per_day: ""        # optional: views/day threshold
#   max: 5

# Local speech-to-text for posts without public captions (Instagram/TikTok audio). pip install faster-whisper
# transcribe: {whisper: true, model: base, max_per_run: 8, max_seconds: 180}

# Quota meter: the report warns at 80% of these caps
# budget: {youtube_api_units_per_day: 10000, apify_items_per_month: 500}

# Ads scout: the best-performing ads in your niche (python -m viral_scout ads <profile>). See docs/ads-scout.md.
# Sources without keys are listed under "Skipped sources"; the run never fails over a missing key.
# ads:
#   advertisers:             # competitors: Meta page names, numeric page ids, or {name, page_id, match, domain}
#     - Competitor Name
#     - {name: Big Brand, match: "^Big Brand( Inc)?$", domain: bigbrand.com}
#   keywords: []             # category searches (write them in the language of the ads)
#   domains: []              # landing domains (Google Ads Transparency via Apify, and lookup links)
#   countries: [US]          # first one is used for Apify and lookup links
#   meta_countries: []       # EU countries for the official Meta API (US commercial ads aren't in the API)
#   sources: [meta_api, tiktok_api, apify_meta, apify_tiktok_top, apify_google]   # default: all of them
#   days: 180                # look back this far
#   per_query: 50            # ads per advertiser/keyword query
#   top: 30                  # rows in "Winning ads"
#   meta_video_pass: true    # one extra Meta API query per search to tag video ads
#   apify_input: {}          # merged into the APIFY_ADS_ACTOR input (actors differ)
#   tiktok_top_input: {}     # input for APIFY_TIKTOK_ADS_ACTOR
#   google_input: {}         # input for APIFY_GOOGLE_ADS_ACTOR
#   output_dir: ""           # default: output_dir above
